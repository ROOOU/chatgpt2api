name: Render keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render service
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://onlybas-chatgpt2api.onrender.com/ping
